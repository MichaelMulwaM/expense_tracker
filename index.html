<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
</head>
<body>
    <div class="container">
        <h1>Student Expense Tracker</h1>
        <p>Track daily spending & categories</p>

        <div class="expense-form">
            <input type="text" id="desc-input" placeholder="Expense description">
            <input type="number" id="amount-input" placeholder="Amount">
            <select id="category-input">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Supplies">Supplies</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <button id="add-btn">Add Expense</button>
        </div>

        <div class="filter-section">
            <label for="filter-category">Filter Category: </label>
            <select id="filter-category">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Supplies">Supplies</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <ul id="expense-list"></ul>
    
</body>
</html>
